<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420">
  <!-- Endfield decoration - Aurorae SVG theme art (order S-kwin, from ds-window-v2.html).
       Spritesheet: every drawn piece is a named element; Aurorae renders pieces by id and
       scales the element's bounding box to its target rect, so each element's box here is
       exactly the piece at 1:1 (buttons = full 40x34 cells).
       Element id scheme (LIVE CHECK FIRST - see README "Needs live check"):
         frame  : top-left|top|top-right|left|right|bottom-left|bottom|bottom-right  +-active|-inactive
         buttons: minimize|maximize|restore|close  +-active|-inactive|-hover|-pressed
       Colours exactly from the mockup:
         titlebar  rgba(10,11,13,.55)   hairline      rgba(255,255,255,.07)
         border f  rgba(255,255,255,.22) border blur  rgba(255,255,255,.10)
         tick      #FFFA00 3x11 at x=15 y=12.5   icons f #c9ccd3  blur #7d8089 at .5
         close hover #d91e36 + #fff      other hover rgba(255,255,255,.07) + #fff
       Glyphs are the mockup's exact paths (24 viewBox, stroke-width 3, butt caps) placed
       in an 11px box centred in the 40x34 cell: translate(+14.5,+11.5) scale(11/24).
       No glows. Square corners. Client area is NOT drawn here (apps paint themselves). -->

  <!-- ===== ACTIVE frame (1px border .22 + 34px title strip + hairline .07) ===== -->
  <!-- top-left: 40x35 fixed slice; holds the focused yellow tick (3x11 at x=15,y=12.5) -->
  <g id="top-left-active">
    <rect x="0" y="0" width="40" height="35" fill="#0a0b0d" fill-opacity="0.55"/>
    <rect x="0" y="0" width="40" height="1" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="0" y="0" width="1" height="35" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="0" y="34" width="40" height="1" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="15" y="12.5" width="3" height="11" fill="#FFFA00"/>
  </g>
  <!-- top: stretchy titlebar middle -->
  <g id="top-active">
    <rect x="50" y="0" width="80" height="35" fill="#0a0b0d" fill-opacity="0.55"/>
    <rect x="50" y="0" width="80" height="1" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="50" y="34" width="80" height="1" fill="#ffffff" fill-opacity="0.07"/>
  </g>
  <!-- top-right: fixed slice at the right edge (buttons drawn separately by KWin) -->
  <g id="top-right-active">
    <rect x="140" y="0" width="80" height="35" fill="#0a0b0d" fill-opacity="0.55"/>
    <rect x="140" y="0" width="80" height="1" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="219" y="0" width="1" height="35" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="140" y="34" width="80" height="1" fill="#ffffff" fill-opacity="0.07"/>
  </g>
  <rect id="left-active" x="230" y="0" width="1" height="80" fill="#ffffff" fill-opacity="0.22"/>
  <rect id="right-active" x="240" y="0" width="1" height="80" fill="#ffffff" fill-opacity="0.22"/>
  <rect id="bottom-left-active" x="250" y="0" width="1" height="1" fill="#ffffff" fill-opacity="0.22"/>
  <rect id="bottom-active" x="260" y="0" width="80" height="1" fill="#ffffff" fill-opacity="0.22"/>
  <rect id="bottom-right-active" x="350" y="0" width="1" height="1" fill="#ffffff" fill-opacity="0.22"/>

  <!-- ===== INACTIVE frame (border .10; the mockup's .win.blur dims title+buttons only) ===== -->
  <g id="top-left-inactive">
    <rect x="0" y="100" width="40" height="35" fill="#0a0b0d" fill-opacity="0.55"/>
    <rect x="0" y="100" width="40" height="1" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="0" y="100" width="1" height="35" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="0" y="134" width="40" height="1" fill="#ffffff" fill-opacity="0.07"/>
  </g>
  <g id="top-inactive">
    <rect x="50" y="100" width="80" height="35" fill="#0a0b0d" fill-opacity="0.55"/>
    <rect x="50" y="100" width="80" height="1" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="50" y="134" width="80" height="1" fill="#ffffff" fill-opacity="0.07"/>
  </g>
  <g id="top-right-inactive">
    <rect x="140" y="100" width="80" height="35" fill="#0a0b0d" fill-opacity="0.55"/>
    <rect x="140" y="100" width="80" height="1" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="219" y="100" width="1" height="35" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="140" y="134" width="80" height="1" fill="#ffffff" fill-opacity="0.07"/>
  </g>
  <rect id="left-inactive" x="230" y="100" width="1" height="80" fill="#ffffff" fill-opacity="0.10"/>
  <rect id="right-inactive" x="240" y="100" width="1" height="80" fill="#ffffff" fill-opacity="0.10"/>
  <rect id="bottom-left-inactive" x="250" y="100" width="1" height="1" fill="#ffffff" fill-opacity="0.10"/>
  <rect id="bottom-inactive" x="260" y="100" width="80" height="1" fill="#ffffff" fill-opacity="0.10"/>
  <rect id="bottom-right-inactive" x="350" y="100" width="1" height="1" fill="#ffffff" fill-opacity="0.10"/>

  <!-- ===== BUTTONS: 40x34 cells (invisible backing rect keeps bounds exact),
       11px glyph centred: translate(x+14.5, y+11.5) scale(0.458333). ===== -->

  <!-- focused: glyph #c9ccd3 -->
  <g id="minimize-active">
    <rect x="0" y="200" width="40" height="34" fill="#000000" fill-opacity="0"/>
    <g transform="translate(14.5,211.5) scale(0.458333)">
      <path d="M5 12h14" fill="none" stroke="#c9ccd3" stroke-width="3" stroke-linecap="butt"/>
    </g>
  </g>
  <g id="maximize-active">
    <rect x="50" y="200" width="40" height="34" fill="#000000" fill-opacity="0"/>
    <g transform="translate(64.5,211.5) scale(0.458333)">
      <rect x="5" y="5" width="14" height="14" fill="none" stroke="#c9ccd3" stroke-width="3" stroke-linecap="butt"/>
    </g>
  </g>
  <!-- restore: the mockup has no restore glyph - the maximize square is reused (README) -->
  <g id="restore-active">
    <rect x="100" y="200" width="40" height="34" fill="#000000" fill-opacity="0"/>
    <g transform="translate(114.5,211.5) scale(0.458333)">
      <rect x="5" y="5" width="14" height="14" fill="none" stroke="#c9ccd3" stroke-width="3" stroke-linecap="butt"/>
    </g>
  </g>
  <!-- close: rule 18 X - four arms, EMPTY centre -->
  <g id="close-active">
    <rect x="150" y="200" width="40" height="34" fill="#000000" fill-opacity="0"/>
    <g transform="translate(164.5,211.5) scale(0.458333)">
      <path d="M5 5l5 5M14 14l5 5M19 5l-5 5M10 14l-5 5" fill="none" stroke="#c9ccd3" stroke-width="3" stroke-linecap="butt"/>
    </g>
  </g>

  <!-- unfocused: glyph #7d8089 at .5 (mockup .win.blur .wb { opacity: .5 }) -->
  <g id="minimize-inactive">
    <rect x="0" y="250" width="40" height="34" fill="#000000" fill-opacity="0"/>
    <g transform="translate(14.5,261.5) scale(0.458333)">
      <path d="M5 12h14" fill="none" stroke="#7d8089" stroke-opacity="0.5" stroke-width="3" stroke-linecap="butt"/>
    </g>
  </g>
  <g id="maximize-inactive">
    <rect x="50" y="250" width="40" height="34" fill="#000000" fill-opacity="0"/>
    <g transform="translate(64.5,261.5) scale(0.458333)">
      <rect x="5" y="5" width="14" height="14" fill="none" stroke="#7d8089" stroke-opacity="0.5" stroke-width="3" stroke-linecap="butt"/>
    </g>
  </g>
  <g id="restore-inactive">
    <rect x="100" y="250" width="40" height="34" fill="#000000" fill-opacity="0"/>
    <g transform="translate(114.5,261.5) scale(0.458333)">
      <rect x="5" y="5" width="14" height="14" fill="none" stroke="#7d8089" stroke-opacity="0.5" stroke-width="3" stroke-linecap="butt"/>
    </g>
  </g>
  <g id="close-inactive">
    <rect x="150" y="250" width="40" height="34" fill="#000000" fill-opacity="0"/>
    <g transform="translate(164.5,261.5) scale(0.458333)">
      <path d="M5 5l5 5M14 14l5 5M19 5l-5 5M10 14l-5 5" fill="none" stroke="#7d8089" stroke-opacity="0.5" stroke-width="3" stroke-linecap="butt"/>
    </g>
  </g>

  <!-- hover: min/max/restore = ds-shell .wb.hover (white .07 cell, #fff glyph) -->
  <g id="minimize-hover">
    <rect x="0" y="300" width="40" height="34" fill="#ffffff" fill-opacity="0.07"/>
    <g transform="translate(14.5,311.5) scale(0.458333)">
      <path d="M5 12h14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="butt"/>
    </g>
  </g>
  <g id="maximize-hover">
    <rect x="50" y="300" width="40" height="34" fill="#ffffff" fill-opacity="0.07"/>
    <g transform="translate(64.5,311.5) scale(0.458333)">
      <rect x="5" y="5" width="14" height="14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="butt"/>
    </g>
  </g>
  <g id="restore-hover">
    <rect x="100" y="300" width="40" height="34" fill="#ffffff" fill-opacity="0.07"/>
    <g transform="translate(114.5,311.5) scale(0.458333)">
      <rect x="5" y="5" width="14" height="14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="butt"/>
    </g>
  </g>
  <!-- close hover: crimson cell + white glyph (mockup .wb.x-hover) -->
  <g id="close-hover">
    <rect x="150" y="300" width="40" height="34" fill="#d91e36"/>
    <g transform="translate(164.5,311.5) scale(0.458333)">
      <path d="M5 5l5 5M14 14l5 5M19 5l-5 5M10 14l-5 5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="butt"/>
    </g>
  </g>

  <!-- pressed: the mockup shows no pressed state - same art as hover (README) -->
  <g id="minimize-pressed">
    <rect x="0" y="350" width="40" height="34" fill="#ffffff" fill-opacity="0.07"/>
    <g transform="translate(14.5,361.5) scale(0.458333)">
      <path d="M5 12h14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="butt"/>
    </g>
  </g>
  <g id="maximize-pressed">
    <rect x="50" y="350" width="40" height="34" fill="#ffffff" fill-opacity="0.07"/>
    <g transform="translate(64.5,361.5) scale(0.458333)">
      <rect x="5" y="5" width="14" height="14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="butt"/>
    </g>
  </g>
  <g id="restore-pressed">
    <rect x="100" y="350" width="40" height="34" fill="#ffffff" fill-opacity="0.07"/>
    <g transform="translate(114.5,361.5) scale(0.458333)">
      <rect x="5" y="5" width="14" height="14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="butt"/>
    </g>
  </g>
  <g id="close-pressed">
    <rect x="150" y="350" width="40" height="34" fill="#d91e36"/>
    <g transform="translate(164.5,361.5) scale(0.458333)">
      <path d="M5 5l5 5M14 14l5 5M19 5l-5 5M10 14l-5 5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="butt"/>
    </g>
  </g>
</svg>
