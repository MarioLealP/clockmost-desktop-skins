# endfield.conf - Endfield skin for kitty (from ref/mocks/components/ds-kitty-v3.html).
# Install: copy to ~/.config/kitty/endfield.conf and add "include endfield.conf" to
# ~/.config/kitty/kitty.conf (or run kitty --config ~/.config/kitty/endfield.conf).
# Colours are the mockup's --an-* vars, 1:1. Mono font: JetBrains Mono (Consolas-like).
# Glass: background_opacity needs KWin blur behind this window - see README "KWin blur".
# Reload: restart kitty / open a new window, or map a key to load_config_file (README).

# --- type -------------------------------------------------------------------
font_family JetBrains Mono
font_size 15

# --- glass ground (mockup .k: rgba(13,14,16,.72)) ----------------------------
background #0d0e10
background_opacity 0.72
# frosted glass: KWin blurs behind the window (kitty asks via the KDE blur protocol)
background_blur 32

# --- text, cursor (yellow block), selection ---------------------------------
foreground #c9ccd3
cursor #FFFA00
cursor_text_color #0d0d0e
cursor_shape block
cursor_blink_interval 0
# mockup shows no selection state; house rule is "yellow = selected"
selection_background #FFFA00
selection_foreground #0d0d0e

# --- ANSI 16 (Endfield palette; Claude Code theme "dark (ANSI)" inherits it) -
color0 #0d0d0e
color1 #d91e36
color2 #7ddb57
color3 #FFFA00
color4 #5aa7ff
color5 #ff1aac
color6 #3FD0E8
color7 #c9ccd3
color8 #6b6e76
color9 #ff5266
color10 #a4f083
color11 #fffb5e
color12 #8fc2ff
color13 #ff5cc8
color14 #7ee4f2
color15 #f1f1f4

# --- window padding (mockup .term: 22px 28px 0) ------------------------------
window_padding_width 22 28 0 28

# --- slim tab line (mockup .tl; drawn by tab_bar.py) -------------------------
tab_bar_edge top
tab_bar_style custom
# the mockup always shows the tab line, even with one tab
tab_bar_min_tabs 1
tab_bar_align left
# tab_bar.py builds "N · TITLE" itself; keep the template the identity
tab_title_template {title}
active_tab_foreground #f1f1f4
inactive_tab_foreground #6b6e76
active_tab_font_style normal
inactive_tab_font_style normal
# Not painted as a plate: tab_bar.py reads active_tab_background back as the
# yellow of the active tab's short underline (draw_data.active_bg, type-safe
# round trip). Also the active plate colour if you switch to the conf-only
# fallback in the README (house style: active = yellow).
active_tab_background #FFFA00
inactive_tab_background #0d0d0e
